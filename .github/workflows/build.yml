name: PC build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build toolchain image
        run: |
          docker build --build-arg USER_UID="$(id -u)" --build-arg USER_GID="$(id -g)" -t petari-build .
      - name: Build native PC targets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspaces/pcport" petari-build \
            bash -c 'xmake f -y -m release --toolchain=clang --runtimes=c++_shared && xmake build -y smg-pc && xmake build -y smg-pc-showcase'
